[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pdfmath"
version = "0.1.0"
description = "A decompiler for TeX mathematics: born-digital PDF -> layout tree -> Presentation MathML"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "pdfmath contributors" }]
dependencies = [
    "pdfminer.six>=20231228",
]

[project.optional-dependencies]
dev = ["pytest>=7", "hypothesis>=6"]
# Independent readers for the AsciiMath and OMML writers.  Tests that need
# them skip when they are absent; nothing at runtime imports them.
oracles = ["py-asciimath>=0.3", "pypandoc_binary>=1.13"]
pdf = ["pikepdf>=8"]

[project.scripts]
pdfmath = "pdfmath.cli.main:main"

[tool.setuptools.packages.find]
include = ["pdfmath*"]

[tool.setuptools.package-data]
"pdfmath.fonts.data" = ["*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
